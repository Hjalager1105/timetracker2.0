<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastro by Bøgh — Time tracker</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="logo.png" alt="Gastro by Bøgh" />
        <div class="brand-text">
          <h1>Gastro by Bøgh</h1>
          <p>Time tracker</p>
        </div>
      </div>
      <nav>
        <button id="tab-clock" class="tab active">Clock in / out</button>
        <button id="tab-admin" class="tab">Admin</button>
      </nav>
    </header>

    <main>
      <section id="view-clock"></section>
      <section id="view-admin" class="hidden"></section>
    </main>

    <p id="status" class="status"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
